<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Лад</title>
<meta name="description" content="Уроки и практика: электрогитара, барабаны, синтезатор, теория и ритм. Работает без интернета.">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Лад">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-cyrillic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main" class="wrap"></main>
<div class="tabs"><nav id="tabs" aria-label="Разделы">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Сегодня</button>
  <button class="tab" data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3.5 2.5 8.5 2.5 12 0v-5"/></svg>Уроки</button>
  <button class="tab" data-tab="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Студия</button>
  <button class="tab" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Тренировки</button>
  <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профиль</button>
</nav></div>
<section class="layer" id="layer1" aria-label="Экран"></section>
<section class="layer" id="layer2" aria-label="Экран"></section>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab" id="grab"><i></i></div><div class="sbody" id="sbody"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="update" id="update" hidden>Есть обновление<button class="btn primary sm" id="updBtn">Обновить</button></div>
<input type="file" id="restore" accept=".json,application/json" hidden>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/theory.js"></script>
<script src="js/widgets.js"></script>
<script src="js/content-theory.js"></script>

<script src="js/content-guitar.js"></script>
<script src="js/content-drums.js"></script>
<script src="js/content-keys.js"></script>
<script src="js/content-styles.js"></script>
<script src="js/content-fret.js"></script>
<script src="js/tools.js"></script>
<script src="js/harmony.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
